[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-analytics"
version = "0.1.0"
description = "F1 historical analytics, live timing, AI driver coach, and LLM race assistant"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0,<3",
    "requests>=2.28",
    "requests-cache>=1.0",
    "pyyaml>=6.0",
    "pyarrow>=14",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "streamlit>=1.40",
    "plotly>=5.20",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.scripts]
f1-analytics = "f1_analytics.cli:main"

[project.optional-dependencies]
live = ["fastf1>=3.8"]
assistant = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]