[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-analytics"
version = "0.1.0"
description = "F1 historical analytics, live timing, AI driver coach, and LLM race assistant"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "requests-cache>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "streamlit>=1.40",
    "plotly>=5.20",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
live = ["fastf1>=3.8"]
assistant = ["openai>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]